source [find interface/cmsis-dap.cfg]
transport select swd

source [find target/stm32f4x.cfg]
adapter speed 6000000

init

set write_cnt 4
set read_cnt 4

# 过滤函数：去掉包含 "bytes written at address" 的行
proc filter_load_image_output {str} {
    set lines [split [string trim $str] "\n"]
    set filtered {}
    foreach line $lines {
        if {![string match "*bytes written at address*" $line]} {
            lappend filtered $line
        }
    }
    return [join $filtered "\n"]
}

# 从输出字符串中提取 (1234.567 KiB/s) 中的数值
proc extract_speed {str} {
    if {[regexp {\(([0-9.]+) KiB/s\)} $str match speed]} {
        return $speed
    }
    return 0
}

# 计算列表平均值
proc avg {list} {
    set count [llength $list]
    if {$count == 0} {return 0}
    set sum 0
    foreach val $list {
        set sum [expr {$sum + $val}]
    }
    return [expr {double($sum) / $count}]
}

set read_speeds {}
set write_speeds {}

# 读测试
for {set i 0} {$i < $read_cnt} {incr i} {
    set result [dump_image 2.bin 0x20000000 65536]
    echo $result
    set speed [extract_speed $result]
    if {$speed > 0} {
        lappend read_speeds $speed
    }
}

# 写测试
for {set i 0} {$i < $write_cnt} {incr i} {
    set result [filter_load_image_output [load_image 2.bin 0x20000000]]
    echo $result
    set speed [extract_speed $result]
    if {$speed > 0} {
        lappend write_speeds $speed
    }
}

# 最终结果
set read_avg [avg $read_speeds]
set write_avg [avg $write_speeds]

echo ""
echo "========= Speed Test Summary ========="
echo "Read  count: [llength $read_speeds], avg speed: [format %.3f $read_avg] KiB/s"
echo "Write count: [llength $write_speeds], avg speed: [format %.3f $write_avg] KiB/s"

shutdown